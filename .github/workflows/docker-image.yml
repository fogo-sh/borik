name: Build Docker image

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      bot: ${{ steps.detect.outputs.bot }}
      worker: ${{ steps.detect.outputs.worker }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Detect changed image targets
        id: detect
        run: ./scripts/detect-docker-image-targets.sh --github-output "${{ github.event.before }}" "${{ github.sha }}"

  build-bot:
    needs: changes
    if: needs.changes.outputs.bot == 'true'
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    uses: nint8835/workflows/.github/workflows/docker-build.yaml@main
    with:
      image_name: fogo-sh/borik
      target: bot

  build-worker:
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    uses: nint8835/workflows/.github/workflows/docker-build.yaml@main
    with:
      image_name: fogo-sh/borik-worker
      target: worker
